name: Build wheels
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  build-wheels:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-14
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      # QEMU 用于交叉编译 Linux aarch64
      - name: Set up QEMU
        if: matrix.runner == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel
      - name: Build wheels via cibuildwheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_PYTHON_VERSIONS: "3.10 3.11 3.12 3.13 3.14"
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_MUSLLINUX_AARCH64_IMAGE: musllinux_1_2
          CIBW_MACOS_DEPLOYMENT_TARGET: "10.15"
          CIBW_TEST_SKIP: "*-musllinux_aarch64"
      - name: Build sdist source package
        run: |
          pip install build
          python -m build --sdist --outdir wheelhouse
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v5
        with:
          name: built-wheels
          path: ./wheelhouse/*.whl
          retention-days: 14

  upload-release:
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag name matches x.y.z (no v‑prefix)
        id: check_tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "valid=1" >> $GITHUB_OUTPUT
          else
              echo "valid=0" >> $GITHUB_OUTPUT
          fi
      - name: Download built wheels
        if: steps.check_tag.outputs.valid == '1' && github.ref_type == 'tag'
        uses: actions/download-artifact@v5
        with:
          name: built-wheels
          path: ./wheels
      - name: Create Github Release & attach wheels
        if: steps.check_tag.outputs.valid == '1' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ./wheels/*
