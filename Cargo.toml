[package]
name = "npfixedcomppy"
version = "0.1.0"
edition = "2021"
description = "Rust core for the npfixedcomppy Python package"
license = "GPL-3.0"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
nalgebra = "0.33"
ndarray = "0.16"
num-traits = "0.2"
rayon = "1.10"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
